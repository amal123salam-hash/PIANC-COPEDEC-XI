<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — PIANC-COPEDEC XI</title>
    <style>
      :root { --primary: #003366; --accent: #00a3e0; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(160deg, #003366 0%, #001a33 100%);
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 420px; }
      .logo {
        width: 96px; height: 96px; margin: 0 auto 24px;
        border-radius: 22px;
        background: rgba(255,255,255,0.08);
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 800; letter-spacing: -1px;
        border: 1px solid rgba(255,255,255,0.15);
      }
      h1 { font-size: 26px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
      p { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.7); margin-bottom: 24px; }
      button {
        background: var(--accent); color: #001a33; border: none;
        padding: 14px 28px; border-radius: 999px; font-size: 15px;
        font-weight: 700; cursor: pointer;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">C11</div>
      <h1>You're offline</h1>
      <p>
        It looks like you've lost your internet connection. Once you're back
        online, the PIANC-COPEDEC XI conference app will be ready to use.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
